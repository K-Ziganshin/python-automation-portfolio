[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023"]  # B023: closures are executed immediately inside the loop

[tool.pytest.ini_options]
pythonpath = ["gmail-telegram-bot", "avito-apartment-monitor", "sheet-schedule-notifier"]
testpaths = ["tests"]
